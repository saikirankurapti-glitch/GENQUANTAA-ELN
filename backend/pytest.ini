[pytest]
# Test Discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio Support
# 'auto' automatically marks all async test functions with pytest.mark.asyncio
asyncio_mode = auto

# Default Command Line Options
# -v: Verbose output
# -s: Disable stdout capturing (allows print statements)
# --strict-markers: Raise error on unregistered markers
# --cov=app: Measure code coverage across the app module
# --cov-report=term-missing: Show missing lines in terminal
addopts = 
    -v 
    --strict-markers 
    --cov=app 
    --cov-report=term-missing 
    --cov-fail-under=90

# Custom Markers
markers =
    unit: Fast, isolated unit tests that do not hit the database or external APIs.
    integration: Slower tests that cross boundaries, hitting the database and real services.
    api: Tests specifically targeting the FastAPI routing layer.
    repository: Tests specifically targeting SQLAlchemy database queries.
    service: Tests targeting isolated business logic.
    security: Tests verifying RBAC, Tenant Isolation, and JWT authorization rules.
    slow: Tests that intentionally sleep or process massive amounts of data.

# Warning Filters
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    # Prevent SQLAlchemy 2.0 async warnings from flooding the test output if misconfigured
    error::sqlalchemy.exc.SAWarning

# CLI Logging Configuration
log_cli = True
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

[coverage:run]
branch = True
source = app
omit =
    tests/*
    app/alembic/*
    app/db/base_class.py
    # Exclude external scripts and configuration from core coverage metrics
    scripts/*

[coverage:report]
# Target Requirements
fail_under = 90
show_missing = True
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
    raise HTTPException
